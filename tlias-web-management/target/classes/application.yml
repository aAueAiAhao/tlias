#配置数据库的连接信息

spring:
  application:
    name: tlias-web-management

  datasource:
    url: jdbc:mysql://localhost:3306/tlias #数据库连接池的类型
    driver-class-name: com.mysql.jdbc.Driver
    username: root
    password: 123456

    #驼峰命名映射
  #mybatis相关配置
  #必须与spring平级
mybatis:
  configuration:
    map-underscore-to-camel-case: true
