#配置数据库的连接信息

spring:
  application:
    name: tlias-web-management

  datasource:
    url: jdbc:mysql://localhost:3306/tlias #数据库连接池的类型
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456

  #驼峰命名映射
  #mybatis相关配置
  #必须与spring平级
mybatis:
  configuration:
    map-underscore-to-camel-case: true


#spring事务管理日志(可以显示日志的debug内容)
logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug
#文件上传大小
servlet:
  multipart:
    max-file-size: 10MB
    max-request-size: 100MB

#阿里云云盘配置信息
aliyun:
  oss:
    endpoint: "https://oss-cn-beijing.aliyuncs.com"
    bucketName: "javaweb-ai-wjh"
    region: "cn-beijing"
